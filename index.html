<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>200 Razones para Estar Contigo</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff66b2, #ffcc00);
            color: #ffffff;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease-in-out;
        }
        .container:hover {
            transform: scale(1.05);
        }
        h1 {
            color: #ffcc00;
            font-size: 24px;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            font-style: italic;
            margin-bottom: 20px;
        }
        button {
            background-color: #ffcc00;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            color: #000;
            font-weight: bold;
        }
        button:hover {
            background-color: #e6b800;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>200 Razones para Estar Contigo</h1>
        <p id="frase">Eres la razón por la que mi corazón sonríe.</p>
        <button onclick="mostrarFrase()">Ver otra razón</button>
    </div>

    <script>
        const frases = [
            "Tu risa ilumina mis días.",
            "Cada momento contigo es especial.",
            "Me haces sentir amado(a) todos los días.",
            "Eres mi mejor amigo(a) y mi amor.",
            "Amo cada pequeño detalle de ti.",
            "Eres la persona con la que quiero compartir mi vida.",
            "No hay nada mejor que despertar a tu lado.",
            "Eres mi refugio en los días difíciles.",
            "Cada día contigo es un regalo.",
            "Me inspiras a ser mejor persona.",
            "Tu amor llena mi corazón de felicidad.",
            "Eres mi lugar seguro en el mundo.",
            "Tienes el poder de hacerme sonreír siempre.",
            "Eres la melodía de mi vida.",
            "Cada beso tuyo es pura magia.",
            "Amo la manera en que me miras.",
            "Eres mi aventura favorita.",
            "Nunca me canso de hablar contigo.",
            "Amo el sonido de tu voz.",
            "Eres el sueño que nunca quiero despertar."
        ];

        function mostrarFrase() {
            const index = Math.floor(Math.random() * frases.length);
            document.getElementById("frase").innerText = frases[index];
        }
    </script>
</body>
</html>
