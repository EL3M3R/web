<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>200 Razones para Estar Contigo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff66b2, #ffcc00);
            color: #ffffff;
            text-align: center;
            padding: 50px;
            animation: fadeIn 1s ease-in-out;
            overflow: hidden;
            position: relative;
        }
        
        .container {
            max-width: 600px;
            margin: auto;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease-in-out;
            animation: slideIn 1s ease-in-out;
            position: relative;
            z-index: 2;
        }
        
        .container:hover {
            transform: scale(1.05);
        }
        
        h1 {
            color: #ffcc00;
            font-size: 24px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        p {
            font-size: 18px;
            font-style: italic;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInText 1.5s ease-in-out forwards;
        }
        
        button {
            background-color: #ffcc00;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            color: #000;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        
        button:hover {
            background-color: #e6b800;
            transform: translateY(-3px);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes fadeInText {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes growFlower {
            0% { transform: scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .flower {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: red;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
            animation: growFlower 5s infinite;
        }
        
        .flower::before, .flower::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: red;
        }
        
        .flower::before {
            top: -15px;
            left: 0;
        }
        
        .flower::after {
            left: -15px;
            top: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>200 Razones para Estar Contigo</h1>
        <p id="frase">Eres la razón por la que mi corazón sonríe.</p>
        <button onclick="mostrarFrase()">Ver otra razón</button>
    </div>
    
    <script>
        const frases = [
            "Tu risa ilumina mis días.",
            "Cada momento contigo es especial.",
            "Me haces sentir amado(a) todos los días.",
            "Eres mi mejor amigo(a) y mi amor.",
            "Amo cada pequeño detalle de ti.",
            "Eres la persona con la que quiero compartir mi vida.",
            "No hay nada mejor que despertar a tu lado.",
            "Eres mi refugio en los días difíciles.",
            "Cada día contigo es un regalo.",
            "Me inspiras a ser mejor persona.",
            "Tu amor llena mi corazón de felicidad.",
            "Eres mi lugar seguro en el mundo.",
            "Tienes el poder de hacerme sonreír siempre.",
            "Eres la melodía de mi vida.",
            "Cada beso tuyo es pura magia.",
            "Amo la manera en que me miras.",
            "Eres mi aventura favorita.",
            "Nunca me canso de hablar contigo.",
            "Amo el sonido de tu voz.",
            "Eres el sueño que nunca quiero despertar."
        ];

        function mostrarFrase() {
            const index = Math.floor(Math.random() * frases.length);
            const fraseElement = document.getElementById("frase");
            fraseElement.style.opacity = "0";
            setTimeout(() => {
                fraseElement.innerText = frases[index];
                fraseElement.style.opacity = "1";
            }, 500);
        }

        function crearFlores() {
            for (let i = 0; i < 10; i++) {
                let flower = document.createElement("div");
                flower.className = "flower";
                flower.style.left = Math.random() * window.innerWidth + "px";
                flower.style.top = Math.random() * window.innerHeight + "px";
                document.body.appendChild(flower);

                setTimeout(() => flower.remove(), 8000);
            }
        }

        setInterval(crearFlores, 3000);
    </script>
</body>
</html>
